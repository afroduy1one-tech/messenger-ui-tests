<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="chat-container">

        <header class="chat-header">
            <div>
                <h1>Messenger</h1>
                <span class="online-status">● В сети</span>
            </div>
        </header>

        <div class="recipient-section">
    <label for="recipient-input">Получатель</label>

    <div class="recipient-wrapper">
        <input
            type="text"
            id="recipient-input"
            placeholder="Введите username"
            autocomplete="off"
        >

        <button
            type="button"
            id="contacts-button"
            class="contacts-button"
            aria-label="Выбрать контакт"
        >
            <span>👥</span>
            <span>⌄</span>
        </button>

        <div id="contacts-list" class="contacts-list">
            <button class="contact" data-username="masha">
                👩 masha
            </button>

            <button class="contact" data-username="zahar">
                👨 zahar
            </button>

            <button class="contact" data-username="egor">
                👨 egor
            </button>
        </div>
    </div>

    <div id="recipient-status" class="field-message"></div>
</div>

        <div class="chat-box" id="chat-box">
            <div class="empty-chat">
                Выберите получателя и напишите сообщение
            </div>
        </div>

        <div class="message-section">

            <textarea
                id="message-input"
                placeholder="Введите сообщение..."
                rows="3"
            ></textarea>

            <div class="counter">
                <span id="message-counter">0</span>/1000
            </div>

            <div id="message-error" class="error-message"></div>

            <button
                id="send-button"
                type="button"
                disabled
            >
                Отправить
            </button>

        </div>

    </div>

    <div id="toast" class="toast"></div>

    <script src="scripts.js"></script>
</body>
</html>
